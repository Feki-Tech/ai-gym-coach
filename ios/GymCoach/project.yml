# XcodeGen project spec — run `xcodegen generate` in this directory.
# https://github.com/yonaskolb/XcodeGen

name: GymCoach
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  CoachCore:
    path: ../CoachCore

targets:
  GymCoach:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: CoachCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AI Gym Coach
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
          - hi
          - es
          - fr
          - ar
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSCameraUsageDescription: >-
          AI Gym Coach analyzes your exercise form live through the camera.
          Video is processed entirely on this device and is never stored or
          uploaded.
        NSHealthShareUsageDescription: >-
          AI Gym Coach reads your heart rate, resting heart rate, HRV, VO2
          max, weight, height, age, sleep, steps, active energy, exercise
          minutes and workouts to personalise coaching cues, heart-rate
          zones and rest. Data is read on this iPhone only and never uploaded.
        NSHealthUpdateUsageDescription: >-
          AI Gym Coach saves each finished set to Health as a Strength
          Training workout so it counts toward your Fitness rings and history.
        LSApplicationQueriesSchemes:
          - x-apple-health
          - fitnessapp
        # Sign-in client ids come from build settings (never from source):
        #   xcodebuild … COACH_GOOGLE_IOS_CLIENT_ID=123-abc.apps.googleusercontent.com
        #                COACH_MICROSOFT_CLIENT_ID=<app id> [COACH_MICROSOFT_TENANT=common]
        # Empty = that provider's button is hidden (Sign in with Apple stays).
        SideloadBuild: $(SIDELOAD_BUILD)
        GoogleClientID: $(COACH_GOOGLE_IOS_CLIENT_ID)
        MicrosoftClientID: $(COACH_MICROSOFT_CLIENT_ID)
        MicrosoftTenant: $(COACH_MICROSOFT_TENANT)
        CFBundleURLTypes:
          - CFBundleURLName: msauth
            CFBundleURLSchemes:
              - msauth.$(PRODUCT_BUNDLE_IDENTIFIER)
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: GymCoach.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.fekitech.gymcoach
        SIDELOAD_BUILD: "NO"
        COACH_GOOGLE_IOS_CLIENT_ID: ""
        COACH_MICROSOFT_CLIENT_ID: ""
        COACH_MICROSOFT_TENANT: common
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
      gatherCoverageData: false
