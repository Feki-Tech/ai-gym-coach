# Unsigned iPhone build for sideloading — no paid Apple Developer account.
# Download the GymCoach.ipa artifact and install it with AltStore or
# Sideloadly on Windows/macOS/Linux using a free Apple ID (docs/IOS.md §9).
name: ios-ipa

on:
  workflow_dispatch:
  push:
    branches: ["main", "feat/**"]
    paths: ["ios/**", ".github/workflows/ios-ipa.yml"]

permissions:
  contents: read

jobs:
  ipa:
    name: Unsigned IPA (sideload)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/GymCoach/project.yml --project ios/GymCoach
      - name: Sideload variant — drop capabilities a free Apple ID can't provision
        # Sign in with Apple needs a paid membership and HealthKit is usually
        # refused for personal-team certificates; a sideloader (AltStore /
        # Sideloadly) fails the whole install when it can't provision an
        # entitlement, so the sideload build carries neither. The app hides
        # the Apple button (SIDELOAD_BUILD=YES) and the Health screen shows
        # the entitlement error instead of crashing.
        run: |
          for key in com.apple.developer.applesignin com.apple.developer.healthkit com.apple.developer.healthkit.access; do
            /usr/libexec/PlistBuddy -c "Delete :$key" ios/GymCoach/GymCoach.entitlements || true
          done
          cat ios/GymCoach/GymCoach.entitlements
      - name: Build for device (unsigned)
        run: >
          xcodebuild build
          -project ios/GymCoach/GymCoach.xcodeproj
          -scheme GymCoach
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          SIDELOAD_BUILD=YES
          COACH_GOOGLE_IOS_CLIENT_ID="${{ secrets.COACH_GOOGLE_IOS_CLIENT_ID }}"
          COACH_MICROSOFT_CLIENT_ID="${{ secrets.COACH_MICROSOFT_CLIENT_ID }}"
          -quiet
      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -d "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          # Ad-hoc signature: sideloaders (AltStore, Sideloadly) read the
          # existing signature + entitlements before re-signing with your
          # Apple ID; a completely unsigned bundle makes them fail
          # ("__init__() missing … 'orig'").
          if [ -d "Payload/GymCoach.app/Frameworks" ]; then
            find Payload/GymCoach.app/Frameworks -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) \
              -exec codesign --force --sign - --timestamp=none {} \;
          fi
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements ios/GymCoach/GymCoach.entitlements Payload/GymCoach.app
          codesign -dv --entitlements - Payload/GymCoach.app 2>&1 | tail -12
          zip -qr GymCoach.ipa Payload
          ls -la GymCoach.ipa
          echo "Bundle: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "Version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") ($(git rev-parse --short HEAD))"
      - uses: actions/upload-artifact@v4
        with:
          name: GymCoach-unsigned-ipa-${{ github.sha }}
          path: GymCoach.ipa
          retention-days: 14
