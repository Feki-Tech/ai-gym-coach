name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: selftest (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.30"
          enable-cache: true
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libgles2 libegl1 libglib2.0-0 espeak-ng
      - name: Install dependencies (pinned from uv.lock)
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Run selftest suite
        run: uv run python pose_coach.py --selftest
      - name: Run coach chat selftests
        run: uv run python coach_chat.py --selftest
      - name: Run coach LLMOps selftests (trace, graders, eval harness)
        run: |
          uv run python coach_ops.py --selftest
          uv run python coach_eval.py --selftest
      - name: Run athlete profile selftests
        run: uv run python coach_profile.py --selftest
      - name: Run calendar selftests
        run: uv run python coach_calendar.py --selftest
      - name: Run sensor fusion selftests
        run: uv run python coach_sensors.py --selftest
      - name: Run device discovery selftests (camera/mic selection)
        run: uv run python coach_devices.py --selftest
      - name: Run HUD selftests (on-screen UI renders every state)
        run: uv run python coach_hud.py --selftest
      - name: Cross-platform parity fixtures (Python side)
        run: uv run python parity_fixtures.py --selftest
      - name: Property-based invariants (seeded fuzz)
        run: uv run python prop_tests.py
      - name: Run dashboard selftests
        run: uv run python coach_dashboard.py --selftest

  docker:
    name: docker build + containerized selftest
    runs-on: ubuntu-latest
    needs: selftest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ai-gym-coach:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Selftest inside container
        run: docker run --rm ai-gym-coach:ci --selftest
      - name: Coach chat selftest inside container
        run: docker run --rm --entrypoint python ai-gym-coach:ci coach_chat.py --selftest
      - name: Coach LLMOps selftests inside container
        run: |
          docker run --rm --entrypoint python ai-gym-coach:ci coach_ops.py --selftest
          docker run --rm --entrypoint python ai-gym-coach:ci coach_eval.py --selftest
      - name: Athlete profile selftest inside container
        run: docker run --rm --entrypoint python ai-gym-coach:ci coach_profile.py --selftest
      - name: Calendar selftest inside container
        run: docker run --rm --entrypoint python ai-gym-coach:ci coach_calendar.py --selftest
      - name: Sensor fusion selftest inside container
        run: docker run --rm --entrypoint python ai-gym-coach:ci coach_sensors.py --selftest
      - name: Device discovery selftest inside container
        run: docker run --rm --entrypoint python ai-gym-coach:ci coach_devices.py --selftest
      - name: HUD selftest inside container
        run: docker run --rm --entrypoint python ai-gym-coach:ci coach_hud.py --selftest
      - name: Parity + property tests inside container
        run: |
          docker run --rm --entrypoint python ai-gym-coach:ci parity_fixtures.py --selftest
          docker run --rm --entrypoint python ai-gym-coach:ci prop_tests.py
      - name: Dashboard selftest inside container
        run: docker run --rm --entrypoint python ai-gym-coach:ci coach_dashboard.py --selftest
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/feki-tech/ai-gym-coach:latest
            ghcr.io/feki-tech/ai-gym-coach:${{ github.sha }}
          cache-from: type=gha

  ios:
    name: iOS — CoachCore tests + app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: CoachCore unit tests (incl. parity replay)
        env:
          PARITY_FIXTURES: ${{ github.workspace }}/data/parity_fixtures.json
        run: swift test --package-path ios/CoachCore
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/GymCoach/project.yml --project ios/GymCoach
      - name: Build app for iOS Simulator
        run: >
          xcodebuild build
          -project ios/GymCoach/GymCoach.xcodeproj
          -scheme GymCoach
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          -quiet
