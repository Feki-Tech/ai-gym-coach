[project]
name = "ai-gym-coach"
version = "0.1.0"
description = "Real-time AI fitness coach: pose estimation, rep counting, tempo, form evaluation and voice feedback (MediaPipe + OpenCV)."
readme = "README.md"
requires-python = ">=3.11"
# Source of truth for dependencies (docs/INFRA.md phase 1). The requirements
# files are kept as hand-maintained pip fallbacks because the docs quote
# `pip install -r requirements.txt` — keep them in sync with this table.
dependencies = [
    "mediapipe>=0.10",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
# Talking TO the coach with your microphone (push-to-talk / hands-free STT);
# mirrors requirements-voice.txt. TTS (talking to YOU) is in the base deps.
voice = [
    "sounddevice>=0.4",
    "faster-whisper>=1.0",
    "pycaw>=20230407; sys_platform == 'win32'",
]

[tool.uv]
# An application, not a distributable package: sync installs the dependencies
# but never tries to build/install the project itself.
package = false
